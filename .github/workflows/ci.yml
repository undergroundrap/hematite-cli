name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Fast style / supply-chain checks — no ORT download needed
  lint:
    name: Format & Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install ALSA dev headers (Linux)
        run: sudo apt-get update -q && sudo apt-get install -y libasound2-dev

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Security audit (Cargo.lock)
        run: cargo audit

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Supply chain check
        run: cargo deny check

  # Build + unit/integration tests on both platforms
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install ALSA dev headers (Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y libasound2-dev

      - uses: Swatinem/rust-cache@v2

      - name: Build (debug)
        run: cargo build --tests

      # Windows: lib tests only — inspect_host integration tests run real
      # PowerShell/WMI commands that take 6+ hours on a hosted runner.
      # Ubuntu: full suite including tests/diagnostics.rs (stubs are instant on Linux).
      - name: Run lib tests (Windows)
        if: runner.os == 'Windows'
        run: cargo test --lib -- --test-threads=4

      - name: Run lib + integration tests (Linux)
        if: runner.os == 'Linux'
        run: cargo test --lib --tests -- --test-threads=4
